# Tests for the firmware's hardware-independent code, run on a computer.
# Run with scripts/test-host.sh (the repository's cargo config targets the
# ESP32-S3, so the host target has to be named explicitly).
[package]
name = "esp32-screen-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
